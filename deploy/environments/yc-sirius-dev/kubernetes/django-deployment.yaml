apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-site
  namespace: edu-aleksandr-babynin
  labels:
    app.kubernetes.io/name: django
    app.kubernetes.io/part-of: django-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: django
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django
        app.kubernetes.io/part-of: django-site
    spec:
      containers:
        - name: django
          image: aleksandrbabynin/k8s-test-django:ff98ae134ac7494780c2030e27cc2ed4832a3a5c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: django
          volumeMounts:
            - name: postgres-root-cert
              mountPath: /etc/postgresql
              readOnly: true
      volumes:
        - name: postgres-root-cert
          secret:
            secretName: postgres-root-cert
            defaultMode: 0444
            items:
              - key: root.crt
                path: root.crt
