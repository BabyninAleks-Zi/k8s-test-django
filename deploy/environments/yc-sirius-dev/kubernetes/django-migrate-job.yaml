apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: edu-aleksandr-babynin
  labels:
    app.kubernetes.io/name: django-migrate
    app.kubernetes.io/part-of: django-site
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-migrate
        app.kubernetes.io/part-of: django-site
    spec:
      restartPolicy: Never
      containers:
        - name: django
          image: aleksandrbabynin/k8s-test-django:ff98ae134ac7494780c2030e27cc2ed4832a3a5c
          imagePullPolicy: IfNotPresent
          command: ["./manage.py"]
          args: ["migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: django
          volumeMounts:
            - name: postgres-root-cert
              mountPath: /etc/postgresql
              readOnly: true
      volumes:
        - name: postgres-root-cert
          secret:
            secretName: postgres-root-cert
            defaultMode: 0444
            items:
              - key: root.crt
                path: root.crt
