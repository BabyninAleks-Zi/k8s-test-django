apiVersion: v1
data:
  nginx.conf: |
    user nginx;
    worker_processes 2;
    events {
      worker_connections 10240;
    }
    http {
      server {
        listen 80;
        server_name localhost;

        location / {
          default_type text/plain;
          return 200 "Hello from Aleksandr Babynin in yc-sirius-dev / edu-aleksandr-babynin\n";
        }
      }
    }
immutable: false
