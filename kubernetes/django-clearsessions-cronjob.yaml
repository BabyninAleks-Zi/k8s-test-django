apiVersion: batch/v1
kind: CronJob
metadata:
  name: django-clearsessions
  labels:
    app.kubernetes.io/name: django-clearsessions
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: django
              image: django_app:latest
              imagePullPolicy: IfNotPresent
              command: ["./manage.py"]
              args: ["clearsessions"]
              envFrom:
                - secretRef:
                    name: django