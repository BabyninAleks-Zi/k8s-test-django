apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-site
  labels:
    app.kubernetes.io/name: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: django
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django
    spec:
      containers:
        - name: django
          image: django_app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: django
                  key: DEBUG
            - name: ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: django
                  key: ALLOWED_HOSTS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: django
                  key: DATABASE_URL
