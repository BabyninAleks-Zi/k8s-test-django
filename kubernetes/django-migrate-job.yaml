apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  labels:
    app.kubernetes.io/name: django-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: django
          image: django_app:latest
          imagePullPolicy: IfNotPresent
          command: ["./manage.py"]
          args: ["migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: django